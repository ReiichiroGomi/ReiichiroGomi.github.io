<!DOCTYPE html>
<html lang="ja">
<head>

  a{display:inline-block;padding:14px 30px;border-radius:40px;background:#b5623a;color:#fff;text-decoration:none;font-size:14px;letter-spacing:.08em;transition:.25s}
